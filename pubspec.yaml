name: saka
description: "Community App."

publish_to: 'none' 

version: 2.1.1+49

environment:
  sdk: ^3.9.2

dependencies:
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
dependency_overrides:
  intl: ^0.19.0
  firebase_core_platform_interface: 5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # A
  android_intent_plus: ^6.0.0
  audio_video_progress_bar: ^2.0.3

  # B
  badges: ^3.1.2
  bubble_tab_indicator: ^0.1.6

  # C
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.1.0
  currency_text_input_formatter: ^2.2.5
  carousel_slider: ^5.1.1
  chips_choice: ^3.0.0
  circular_countdown_timer: ^0.2.0
  clipboard: ^0.1.3

  # D
  dio: ^5.9.0
  detectable_text_field: ^3.0.2
  date_count_down: ^3.0.0
  dots_indicator: ^2.0.0
  draggable_float_widget: ^0.0.2
  draggable_widget: ^2.0.0
  date_time_picker:
    git:
      url: https://github.com/DavidHDJ/date_time_picker.git
      ref: 2.1.1
  delayed_display: ^2.0.0

  # F
  flappy_search_bar_ns: ^2.0.2
  floating_bottom_navigation_bar: ^1.5.2
  flutter_animated_dialog_updated: ^1.0.1
  flutter_animator: ^3.2.2
  flutter_pdfview: ^1.2.1
  flutter_lints: ^5.0.0
  flutter_widget_from_html: ^0.15.1
  flutter_spinkit: ^5.1.0
  flutter_staggered_grid_view: ^0.4.0
  flutter_svg: ^2.0.7
  flutter_rating_bar: ^4.0.1
  flutter_switch: ^0.3.2
  flutter_html: ^3.0.0-alpha.6
  flutter_launcher_icons: ^0.14.4 
  flutter_link_previewer: ^3.2.2
  flutter_local_notifications: ^18.0.1
  flutter_native_contact_picker: ^0.0.4
  fluttertoast: ^8.2.2
  flutter_keyboard_visibility: ^6.0.0
  flutter_typeahead: ^5.2.0
  file_picker: 
  filesize: ^2.0.1

  # G
  geocoding: ^2.0.5
  google_api_headers: ^4.4.1
  get_it: ^7.1.3
  google_maps_flutter: ^2.2.1
  google_maps_place_picker_mb_v2: ^1.0.1
  geolocator: ^14.0.0

  # H
  hex: ^0.2.0

  # I
  image_cropper: ^11.0.0
  image_gallery_saver_plus2: ^4.0.3
  image_picker: ^1.0.4
  just_audio: ^0.9.30
  just_audio_background: ^0.0.1-beta.9

  # J
  jwt_decoder: ^2.0.1

  # M
  mask_text_input_formatter: ^2.1.0
  mime: ^1.0.1
  modal_bottom_sheet:
    git:
      url: https://github.com/danReynolds/modal_bottom_sheet.git
      path: modal_bottom_sheet
  multi_image_picker_plus: 

  # N
  new_version_plus: ^0.0.10
  path_provider: ^2.0.5
  permission_handler: ^11.0.1
  photo_view: ^0.14.0
  pin_code_fields: ^8.0.1

  # P
  provider: ^6.0.1

  # Q
  qr_code_scanner_plus: ^2.0.14
  qr_flutter: ^4.1.0

  # R
  readmore: ^2.1.0
  rxdart: ^0.27.5
  shared_preferences: ^2.3.2

  # S
  shimmer: ^2.0.0
  slide_to_confirm: ^1.1.0
  slide_countdown: ^1.6.1
  sn_progress_dialog: ^1.0.3
  syncfusion_flutter_calendar: ^31.2.3

  # T
  timeago: ^3.4.0
  timelines_plus: ^1.0.8
  table_calendar: ^3.0.9

  # U
  url_launcher: ^6.0.20
  uuid: ^4.5.1
  video_compress: ^3.1.2

  # V
  video_player: ^2.3.0
  visibility_detector: ^0.4.0+2

  # W
  webview_flutter: ^4.2.1


flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/ic-app.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/svg/
    - assets/images/feed/
    - assets/images/background/
    - assets/images/icons/couriers/
    - assets/images/icons/
    - assets/images/update/
    - assets/imagesv2/
    - assets/imagesv2/svg/
    - assets/imagesv2/onboarding/
    - assets/icons/
    - assets/language/
    - assets/pdf/
    - assets/sounds/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Italic.ttf
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
        - asset: assets/fonts/roboto/Roboto-Bold.ttf